[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baddaw"
version = "0.0.1"
description = "A code-first DAW for Jupyter"
requires-python = ">=3.10"
dependencies = ["numpy", "soundfile", "soxr"]

[project.optional-dependencies]
play = ["sounddevice"]
notebook = ["baddaw[play]", "anywidget", "jupyterlab", "notebook"]
dev = ["pytest", "anywidget"]
browser = ["baddaw[dev]", "playwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: renders the notebook UI in headless chromium (needs playwright)"]
