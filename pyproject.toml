[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baddaw"
version = "0.0.1"
description = "A code-first DAW for Jupyter"
requires-python = ">=3.10"
dependencies = ["numpy", "soundfile", "soxr"]

[project.optional-dependencies]
play = ["sounddevice"]
notebook = ["baddaw[play]", "jupyterlab", "notebook"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
